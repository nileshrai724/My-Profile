apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-web
  labels:
    app: learning-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-web
  template:
    metadata:
      labels:
        app: learning-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: learning-web
spec:
  type: ClusterIP
  selector:
    app: learning-web
  ports:
    - name: http
      port: 80
      targetPort: http
