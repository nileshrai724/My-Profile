services:
  web:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
