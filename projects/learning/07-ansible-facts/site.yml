---
- name: Inspect the local machine (read-only)
  hosts: local
  gather_facts: true
  tasks:
    - name: Show basic operating system information
      ansible.builtin.debug:
        msg:
          - "Host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"

    - name: Show processor count
      ansible.builtin.debug:
        msg: "vCPUs detected: {{ ansible_processor_vcpus }}"
